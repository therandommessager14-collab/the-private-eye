backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "articles"
    label: "Articles"
    folder: "articles"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Headline"
        name: "title"
        widget: "string"

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "JUST IN"
          - "ON THE RADAR"
          - "THE BUZZ"
          - "SPOTTED"
          - "STYLE & LUXURY"

      - label: "Featured Image"
        name: "image"
        widget: "image"
        required: false

      - label: "Article"
        name: "body"
        widget: "markdown"

      - label: "Author / Sign-off"
        name: "author"
        widget: "string"
        default: "The Private Eye"

      - label: "Publish Date"
        name: "date"
        widget: "datetime"

      - label: "Published"
        name: "published"
        widget: "boolean"
        default: false
